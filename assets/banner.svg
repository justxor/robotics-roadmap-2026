<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#12243d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f3a5c" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffc145"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.55"/>
  <circle cx="1000" cy="330" r="300" fill="url(#glow)"/>

  <!-- ===== Robot arm (original line illustration) ===== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- base -->
    <rect x="850" y="470" width="190" height="34" rx="8" fill="#1b2f4b" stroke="#5aa9ff" stroke-width="3"/>
    <rect x="895" y="440" width="100" height="34" rx="8" fill="#1b2f4b" stroke="#5aa9ff" stroke-width="3"/>
    <!-- link 1 -->
    <path d="M945 445 L905 300" stroke="#5aa9ff" stroke-width="26"/>
    <path d="M945 445 L905 300" stroke="#0e1c30" stroke-width="14"/>
    <!-- link 2 -->
    <path d="M905 300 L1065 230" stroke="#5aa9ff" stroke-width="22"/>
    <path d="M905 300 L1065 230" stroke="#0e1c30" stroke-width="11"/>
    <!-- joints -->
    <circle cx="945" cy="445" r="20" fill="#0e1c30" stroke="#ff8a3d" stroke-width="5"/>
    <circle cx="905" cy="300" r="18" fill="#0e1c30" stroke="#ff8a3d" stroke-width="5"/>
    <circle cx="1065" cy="230" r="15" fill="#0e1c30" stroke="#ff8a3d" stroke-width="5"/>
    <!-- gripper -->
    <path d="M1065 230 L1100 250 L1120 290" stroke="#ffc145" stroke-width="7"/>
    <path d="M1065 230 L1110 222 L1145 245" stroke="#ffc145" stroke-width="7"/>
    <!-- object -->
    <rect x="1112" y="292" width="40" height="40" rx="5" fill="#ff8a3d" opacity="0.9" stroke="none"/>
    <!-- motion arc -->
    <path d="M840 300 A130 130 0 0 1 930 175" stroke="#ffc145" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.8"/>
    <path d="M924 168 L932 176 L921 182" stroke="#ffc145" stroke-width="2.5"/>
  </g>

  <!-- ===== Small rover ===== -->
  <g>
    <rect x="1080" y="470" width="130" height="44" rx="10" fill="#1b2f4b" stroke="#5aa9ff" stroke-width="3"/>
    <rect x="1130" y="446" width="34" height="24" rx="4" fill="#0e1c30" stroke="#ff8a3d" stroke-width="3"/>
    <circle cx="1105" cy="518" r="17" fill="#0e1c30" stroke="#5aa9ff" stroke-width="4"/>
    <circle cx="1185" cy="518" r="17" fill="#0e1c30" stroke="#5aa9ff" stroke-width="4"/>
    <path d="M1170 446 L1170 430 M1148 430 a22 22 0 0 1 44 0" fill="none" stroke="#ffc145" stroke-width="2.5" stroke-dasharray="4 5"/>
  </g>

  <!-- floor line -->
  <path d="M820 536 H1240" stroke="#2c4f7a" stroke-width="2"/>

  <!-- ===== Text ===== -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="118" font-size="22" font-weight="600" fill="#ffc145" letter-spacing="4">ОТКРЫТЫЙ КУРС · 2026</text>
    <text x="78" y="200" font-size="76" font-weight="800" fill="#ffffff">Robotics</text>
    <text x="78" y="282" font-size="76" font-weight="800" fill="url(#accent)">Roadmap 2026</text>
    <text x="80" y="340" font-size="27" fill="#c9d6e8">Собери первого робота и войди</text>
    <text x="80" y="376" font-size="27" fill="#c9d6e8">в робототехнику с нуля за 6 месяцев</text>
  </g>

  <!-- ===== Roadmap steps ===== -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <path d="M100 460 H700" stroke="#2c4f7a" stroke-width="4"/>
    <path d="M100 460 H700" stroke="url(#accent)" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
    <g fill="#0e1c30" stroke="#ff8a3d" stroke-width="4">
      <circle cx="100" cy="460" r="14"/><circle cx="220" cy="460" r="14"/><circle cx="340" cy="460" r="14"/>
      <circle cx="460" cy="460" r="14"/><circle cx="580" cy="460" r="14"/><circle cx="700" cy="460" r="14"/>
    </g>
    <g fill="#ffc145" font-size="14" font-weight="800">
      <text x="100" y="465">1</text><text x="220" y="465">2</text><text x="340" y="465">3</text>
      <text x="460" y="465">4</text><text x="580" y="465">5</text><text x="700" y="465">6</text>
    </g>
    <g fill="#e6eef8">
      <text x="100" y="502">Электроника</text>
      <text x="220" y="502">Arduino</text>
      <text x="340" y="502">CAD и 3D</text>
      <text x="460" y="502">ROS 2</text>
      <text x="580" y="502">Управление</text>
      <text x="700" y="502">LeRobot</text>
    </g>
    <g fill="#8aa4c4" font-weight="400" font-size="13">
      <text x="100" y="522">паяльник, Git</text>
      <text x="220" y="522">ESP32, моторы</text>
      <text x="340" y="522">рука SO-101</text>
      <text x="460" y="522">SLAM, Nav2</text>
      <text x="580" y="522">PID, LQR, CV</text>
      <text x="700" y="522">обучение, VLA</text>
    </g>
  </g>

  <text x="80" y="590" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6f8bb0">100+ открытых ресурсов · схемы · готовый код · железо на 3 бюджета</text>
</svg>
